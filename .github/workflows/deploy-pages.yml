      PROMOTION_FLAT_LABEL: ${{ vars.PROMOTION_FLAT_LABEL || secrets.PROMOTION_FLAT_LABEL }}
      PROMOTION_NONE_LABEL: ${{ vars.PROMOTION_NONE_LABEL || secrets.PROMOTION_NONE_LABEL }}
      PROMOTION_PERCENT_LABEL: ${{ vars.PROMOTION_PERCENT_LABEL || secrets.PROMOTION_PERCENT_LABEL }}
      QUEUE_TRACKING_TEXT: ${{ vars.QUEUE_TRACKING_TEXT || secrets.QUEUE_TRACKING_TEXT }}
      SAMPLE_COUNT: ${{ vars.SAMPLE_COUNT || secrets.SAMPLE_COUNT }}
      SITE_DESCRIPTION: ${{ vars.SITE_DESCRIPTION || secrets.SITE_DESCRIPTION }}
      SITE_TITLE: ${{ vars.SITE_TITLE || secrets.SITE_TITLE }}
      SITE_URL: ${{ vars.SITE_URL || secrets.SITE_URL }}
      SUPPORT_HEADING: ${{ vars.SUPPORT_HEADING || secrets.SUPPORT_HEADING }}
      TABLE_CATEGORY: ${{ vars.TABLE_CATEGORY || secrets.TABLE_CATEGORY }}
      TABLE_SOURCE_DIR: ${{ vars.TABLE_SOURCE_DIR || secrets.TABLE_SOURCE_DIR }}
      TELEGRAM_LINK_TEXT: ${{ vars.TELEGRAM_LINK_TEXT || secrets.TELEGRAM_LINK_TEXT }}
      TELEGRAM_URL: ${{ vars.TELEGRAM_URL || secrets.TELEGRAM_URL }}
      TOS_DESCRIPTION: ${{ vars.TOS_DESCRIPTION || secrets.TOS_DESCRIPTION }}
      TOS_SECTIONS: ${{ vars.TOS_SECTIONS || secrets.TOS_SECTIONS }}
      TOS_TITLE: ${{ vars.TOS_TITLE || secrets.TOS_TITLE }}
      TOS_UPDATED: ${{ vars.TOS_UPDATED || secrets.TOS_UPDATED }}
      TOYHOUSE_LINK_TEXT: ${{ vars.TOYHOUSE_LINK_TEXT || secrets.TOYHOUSE_LINK_TEXT }}
      TOYHOUSE_URL: ${{ vars.TOYHOUSE_URL || secrets.TOYHOUSE_URL }}
      TRELLO_LINK_TEXT: ${{ vars.TRELLO_LINK_TEXT || secrets.TRELLO_LINK_TEXT }}
      TRELLO_URL: ${{ vars.TRELLO_URL || secrets.TRELLO_URL }}
      TWITCH_LINK_TEXT: ${{ vars.TWITCH_LINK_TEXT || secrets.TWITCH_LINK_TEXT }}
      TWITCH_URL: ${{ vars.TWITCH_URL || secrets.TWITCH_URL }}
      VGEN_LINK_TEXT: ${{ vars.VGEN_LINK_TEXT || secrets.VGEN_LINK_TEXT }}
      VGEN_URL: ${{ vars.VGEN_URL || secrets.VGEN_URL }}
      X_LINK_TEXT: ${{ vars.X_LINK_TEXT || secrets.X_LINK_TEXT }}
      X_URL: ${{ vars.X_URL || secrets.X_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check syntax and build contracts
        run: |
          npm run check:syntax
          npm test

      - name: Build site
        run: npm run build

      - name: Check built HTML, links and assets
        run: npm run check:output

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Check responsive pages, keyboard controls and accessibility
        run: npm run check:browser

      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: test-results/
          if-no-files-found: ignore

      - name: Deploy to gh-pages branch
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          cname: coffeescrafts.com
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
