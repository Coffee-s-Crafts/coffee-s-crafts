      NAV_CONTACT: ${{ vars.NAV_CONTACT || secrets.NAV_CONTACT }}
      NAV_FURSUIT: ${{ vars.NAV_FURSUIT || secrets.NAV_FURSUIT }}
      NAV_GALLERY: ${{ vars.NAV_GALLERY || secrets.NAV_GALLERY }}
      NAV_HOME: ${{ vars.NAV_HOME || secrets.NAV_HOME }}
      NAV_LABEL: ${{ vars.NAV_LABEL || secrets.NAV_LABEL }}
      NAV_PREMADE: ${{ vars.NAV_PREMADE || secrets.NAV_PREMADE }}
      OG_IMAGE_URL: ${{ vars.OG_IMAGE_URL || secrets.OG_IMAGE_URL }}
