      PREMADE_CATEGORY: ${{ vars.PREMADE_CATEGORY || secrets.PREMADE_CATEGORY }}
      PREMADE_HEADING: ${{ vars.PREMADE_HEADING || secrets.PREMADE_HEADING }}
      PREMADE_INTRO: ${{ vars.PREMADE_INTRO || secrets.PREMADE_INTRO }}
      PREMADE_LINK: ${{ vars.PREMADE_LINK || secrets.PREMADE_LINK }}
      PREMADE_META: ${{ vars.PREMADE_META || secrets.PREMADE_META }}
      PREMADE_NEXT_STEPS: ${{ vars.PREMADE_NEXT_STEPS || secrets.PREMADE_NEXT_STEPS }}
      PREMADE_SECTIONS: ${{ vars.PREMADE_SECTIONS || secrets.PREMADE_SECTIONS }}
      PREMADE_SOURCE_DIR: ${{ vars.PREMADE_SOURCE_DIR || secrets.PREMADE_SOURCE_DIR }}
